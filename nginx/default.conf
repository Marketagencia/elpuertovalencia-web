map_hash_bucket_size 256;
map_hash_max_size 4096;

map $uri $old_redirect {
    default "";
    include /etc/nginx/redirects.map;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # El proxy de Easypanel reenvía por HTTP interno tras terminar TLS;
    # sin esto, nginx construiría redirecciones a http:// en vez de https://.
    absolute_redirect off;

    # Compresión: el HTML pesaba 100 KB sin comprimir.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/ld+json image/svg+xml font/ttf font/otf;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # URLs heredadas del WordPress anterior sin equivalente 1:1: mandamos
    # a la página que más se le parece en el sitio nuevo.
    location ~ ^/(tag|category|product-category)/ {
        return 301 /blog.html;
    }

    location ~ ^/(shop|shop-2|home-2|portfolio|wishlist|compare)(/|$) {
        return 301 /;
    }

    # Redirecciones específicas generadas desde Search Console
    # (scripts/build_redirects.py). Tienen prioridad sobre las reglas
    # genéricas de arriba.
    if ($old_redirect != "") {
        return 301 $old_redirect;
    }

    # Variantes /amp/ sueltas que no tengan ya una redirección específica.
    location ~ ^(?<amp_base>/.+)/amp/?$ {
        return 301 $amp_base/;
    }

    # Caché del navegador para recursos estáticos (nombres sin hash:
    # 30 días y revalidación con ETag pasado ese tiempo).
    location ~* \.(?:webp|avif|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # El PDF pesa ~7 MB: que se pueda cachear pero revalidar.
    location ~* \.pdf$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML: siempre revalidar (ETag) para que los cambios se vean al momento.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
