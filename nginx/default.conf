map_hash_bucket_size 256;
map_hash_max_size 4096;

map $uri $old_redirect {
    default "";
    include /etc/nginx/redirects.map;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # URLs heredadas del WordPress anterior sin equivalente 1:1: mandamos
    # a la página que más se le parece en el sitio nuevo.
    location ~ ^/(tag|category|product-category)/ {
        return 301 /blog.html;
    }

    location ~ ^/(shop|shop-2|home-2|portfolio|wishlist|compare)(/|$) {
        return 301 /;
    }

    # Redirecciones específicas generadas desde Search Console
    # (scripts/build_redirects.py). Tienen prioridad sobre las reglas
    # genéricas de arriba.
    if ($old_redirect != "") {
        return 301 $old_redirect;
    }

    # Variantes /amp/ sueltas que no tengan ya una redirección específica.
    location ~ ^(?<amp_base>/.+)/amp/?$ {
        return 301 $amp_base/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
